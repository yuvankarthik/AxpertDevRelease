<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="jconfirm">
        <div class="jconfirm-bg jconfirm-bg-h"></div>
        <div class="jconfirm-scrollpane">
            <div class="jconfirm-row">
                <div class="jconfirm-cell">
                    <div class="jconfirm-holder">
                        <div class="jc-bs3-container">
                            <div class="jc-bs3-row">
                                <div class="jconfirm-box-container jconfirm-animated custom-jconfirm-box">
                                    <div class="jconfirm-box" role="dialog" aria-labelledby="labelled" tabindex="-1">
                                        <div class="jconfirm-closeIcon">&times;</div>
                                        <div class="jconfirm-title-c"><span class="jconfirm-icon-c"></span><span
                                                class="jconfirm-title"></span></div>
                                        <div class="jconfirm-content-pane">
                                            <div class="jconfirm-content">
                                                <div class='d-flex justify-content-center'><span id='defalutText'
                                                        class='defalutText'>Please Enter Your Password To Proceed</span>
                                                </div>
                                                <div class="d-flex justify-content-center input-icon left"><input
                                                        id="passwordfield"
                                                        class="m-wrap placeholder-no-fix form-control form-control-solid "
                                                        tabindex="1" type="password" autocomplete="off"
                                                        placeholder="Password" name="" title="Password" required="">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="jconfirm-buttons"></div>
                                        <div class="jconfirm-clear"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
